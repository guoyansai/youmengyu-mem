<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!--
    游梦鱼·长记忆 · 扩展图标（插件商店 LOGO）
    风格：游梦鱼数字人鱼形头像 + 深邃宇宙渐变背景
    导出：media/icon.png 由本文件生成
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f2e52"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="fishGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- 主体鱼头像组 -->
  <g transform="translate(28 30) scale(1.75)">
    <!-- 光晕 -->
    <circle cx="60" cy="62" r="56" fill="url(#fishGlow)"/>

    <!-- 尾巴 -->
    <path d="M16 60 Q2 38 6 60 Q2 82 16 60" fill="url(#finGrad)"/>
    <path d="M20 46 Q6 60 20 74" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>

    <!-- 鱼身 -->
    <ellipse cx="58" cy="60" rx="42" ry="28" fill="url(#fishBody)"/>
    <ellipse cx="52" cy="66" rx="28" ry="14" fill="white" opacity="0.18"/>

    <!-- 背鳍 -->
    <path d="M48 38 Q58 26 68 38 Q58 48 48 38" fill="url(#finGrad)" opacity="0.85"/>

    <!-- 眼睛 -->
    <circle cx="78" cy="52" r="10" fill="white"/>
    <circle cx="81" cy="51" r="5" fill="#0f172a"/>
    <circle cx="83" cy="49" r="2" fill="white"/>

    <!-- 微笑 -->
    <path d="M72 67 Q80 76 88 67" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
